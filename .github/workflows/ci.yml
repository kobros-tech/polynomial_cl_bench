name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Rules are explicit in pyproject.toml [tool.ruff]; the version matches .pre-commit-config.yaml
      # or newer (checked with 0.16.7 and 0.17.3).
      - run: python -m pip install "ruff>=0.16.7"
      - run: ruff check .
      - run: ruff format --check .

  tests:
    # Installs the package exactly as a user would: the core comes from the SHA pinned in
    # pyproject.toml, fetched from GitHub. No local core checkout is involved.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # A missing or incompatible core fails the run instead of skipping integration tests,
      # and the installed core must be the declared pin (pip VCS install, remote-verified).
      BENCH_REQUIRE_CORE: "1"
      BENCH_REQUIRE_PINNED_CORE: "1"
      # Single-threaded BLAS so the exact-equality reproducibility checks are meaningful.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the benchmark and the core pinned in pyproject.toml
        run: python -m pip install -e ".[dev]"
      - name: Show the installed core
        run: python -c "import importlib.metadata as m; print(m.distribution('polynomial-cl').read_text('direct_url.json'))"
      - name: Fast suite (unit tests and real-core synthetic integration)
        run: python -m pytest -q -rs
      - name: Command-line entry points still load against the pinned core
        run: |
          python -m polynomial_cl_bench.runner --help > /dev/null
          python -m polynomial_cl_bench.tune --help > /dev/null
          python -m polynomial_cl_bench.summarize --help > /dev/null
          python -m polynomial_cl_bench.verify_data --help > /dev/null
          python tools/analyze_per_degree_study.py --help > /dev/null
          python tools/run_comparison_study.py --help > /dev/null
          python tools/build_paper_assets.py --help > /dev/null
          python tools/build_paper.py --help > /dev/null
          python tools/paper_rst_assets.py --help > /dev/null

  docs:
    # Builds the Sphinx documentation with warnings as errors. The core is installed from the pin
    # (the API pages import the package), so a broken import or docstring fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Lint the Markdown with the repository configuration
        run: npx --yes markdownlint-cli2 README.md
      - name: Install the benchmark with the documentation extra
        run: python -m pip install -e ".[docs]"
      - name: Build HTML (warnings are errors)
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: Build LaTeX (warnings are errors)
        run: python -m sphinx -W --keep-going -b latex docs docs/_build/latex
      - name: Install a TeX toolchain for the PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended tex-gyre
      - name: Build the PDF
        run: make -C docs/_build/latex
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: |
            docs/_build/html
            docs/_build/latex/polynomial_cl_bench.pdf

  paper:
    # Builds the paper from its canonical reStructuredText source in all three formats and runs
    # the tests that check the migration (including the HTML and Word builds, which skip when
    # their tools are missing; here they are present, so they run).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the TeX toolchain, pandoc and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended pandoc poppler-utils
      - name: Install the benchmark with the documentation and development extras
        run: python -m pip install -e ".[docs,dev]"
      - name: Paper tests (migration, derived assets, HTML and Word builds)
        run: python -m pytest -q -rs tests/test_paper.py
      - name: Build HTML, PDF and Word from the RST source
        run: python tools/build_paper.py all
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: |
            paper/_build/html
            paper/_build/latex/paper.pdf
            paper/_build/docx/paper.docx
