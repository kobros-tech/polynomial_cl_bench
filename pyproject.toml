[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "polynomial-cl-bench"
version = "0.1.0"
description = "Independent benchmark environment for continual-learning algorithms (Split MNIST CIL first)"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    # Pinned to an immutable full commit SHA, never a branch name.
    # 2e806d7 is the merge commit of core PR #10 (opt-in diagnostics, whole-call timings) on the core's
    # `main`. When the pin is changed, keep
    # the URL identical (provenance compares it) and check the commit exists on the remote:
    #   git ls-remote https://github.com/kobros-tech/polynomial_cl_core.git
    "polynomial-cl @ git+https://github.com/kobros-tech/polynomial_cl_core.git@2e806d7a3437e930256eb49ab7a3ec5e650a1110",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "scipy", "pyyaml"]
# Documentation build (docs/). The core is a regular dependency, so autodoc can import every module.
docs = ["sphinx>=7", "furo"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Explicit on purpose: recent Ruff versions enable only the F rules by default, which would make
# "ruff passes" a much weaker statement than the pre-commit hook suggests.
# BLE: a blind `except Exception` is allowed only where the code records the failure and carries
# `# noqa: BLE001 - <why>` (runner, worker, tuning).
select = ["F", "E4", "E7", "E9", "BLE"]
# Pre-existing style, not changed here: `l` as a loop variable and lambda assignments.
ignore = ["E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# sys.path is extended before the package imports in scripts, and a helper block sits mid-file.
"tools/*.py" = ["E402"]
"tests/helpers.py" = ["E402"]
