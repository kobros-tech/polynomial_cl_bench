[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "polynomial-cl-bench"
version = "0.1.0"
description = "Independent benchmark environment for continual-learning algorithms (Split MNIST CIL first)"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    # Pinned upstream commit. Verify it exists on the remote before releasing:
    #   git ls-remote https://github.com/kobros-tech/polynomial_cl_demo.git
    #   (or clone and run: git branch -r --contains 9e1573238a1c1e21d63a196daee0ec1ca9037d16)
    "polynomial-cl @ git+https://github.com/kobros-tech/polynomial_cl_demo.git@9e1573238a1c1e21d63a196daee0ec1ca9037d16",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
